<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رابط 2026 | حقيقة بدون تجميل</title>
    
    <style>
        /* إعادة ضبط القواعد الأساسية */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* حاوية البطاقة الرئيسية */
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 30px 24px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            color: #38bdf8;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
        }

        /* صندوق عرض الصورة والنص */
        .quote-box {
            background-color: #0f172a;
            border-right: 4px solid #ef4444;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        /* تنسيق الصورة الدلالية */
        .avatar-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ef4444;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .quote-text {
            color: #e2e8f0;
            font-size: 16px;
            line-height: 1.8;
            font-weight: 400;
            text-align: right;
            width: 100%;
        }

        /* تنسيق الأزرار */
        .button-group {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        .btn-main {
            background-color: #ef4444;
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }

        .btn-copy {
            background-color: #334155;
            color: #38bdf8;
            border: 1px solid #475569;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }

        .btn-main:active, .btn-copy:active {
            transform: scale(0.98);
        }

        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>رابط 2026</h1>
        <p class="subtitle">صوت الواقع.. كفّ عن المهرجة والاستجداء</p>

        <!-- صندوق المحتوى -->
        <div class="quote-box">
            <!-- الصورة الدلالية للمهرج/العفوي المصنوع -->
            <img id="quote-img" class="avatar-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" alt="صورة دلالية">
            
            <!-- النص الصارم -->
            <p id="quote" class="quote-text">اضغط على الزر أدناه لتستمع إلى الحقيقة الصريحة بدون مساحيق.</p>
        </div>

        <!-- أزرار التفاعل -->
        <div class="button-group">
            <button class="btn-main" onclick="generateQuote()">تلقَّ الواقع</button>
            <button class="btn-copy" onclick="copyQuote()">نسخ النص</button>
        </div>

        <footer>
            رابط 2026 &copy; الرزانة ليست خياراً، بل ثمن احترامك لنفسك.
        </footer>
    </div>

    <script>
        // مصفوفة الكائنات (تحتوي على النص ورابط الصورة المرافقة)
        const dataList = [
            {
                text: "تتضاحك وتفتعل الحركات الهستيرية لتلفت الأنظار، ثم تتساءل في سرّك لماذا لا يتعامل معك أحد بجدية؟ انظر إلى منظرك، أنت لا تبدو 'عفوياً' أو 'مرحاً'، أنت تبدو كشخص يستجدي الانتباه بأي ثمن. الثقل هيبة، والاستخفاف يسقط قيمتك في دقائق.",
                image: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80"
            },
            {
                text: "العفوية التي تُعدّ لها مسبقاً وتفرضها على الحاضرين في كل مجلس ليست طيبة، بل هي قلة احترام وحماقة مجردة. الصمت والوقار لم يضعفا شخصية أحد قط، لكن التهرّج ومحاولة إضحاك القوم غصباً تجعلك مسخرة الجلسة بعد مغادرتك.",
                image: "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150&auto=format&fit=crop&q=80"
            },
            {
                text: "توقف عن لعب دور 'الأحمق السعيد' في المجموعة. تحسب أنهم يحبون خفة دمك، بينما الحقيقة أنهم يجدون فيك وسيلة للتسلية المجانية. ارزن واستعد كرامتك، فالمجالس بُنيت للرجال ولصاحب الموقف، لا لمن يرتدي قناع المهرج.",
                image: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=80"
            },
            {
                text: "ليس كل فراغ بحاجة لنكتة بايخة أو صراخ أهوج. عندما لا تجد ما تقوله، فالصمت هو أعظم رد وأرقى حضور. أما التخبط والكلام لمجرد ملء الفراغ فهو دليل على خفة العقل وليس وسامة الطبع.",
                image: "https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?w=150&auto=format&fit=crop&q=80"
            }
        ];

        // دالة تحديث النص والصورة عشوائياً
        function generateQuote() {
            const quoteElement = document.getElementById("quote");
            const imgElement = document.getElementById("quote-img");
            
            // اختيار عنصر عشوائي
            const randomIndex = Math.floor(Math.random() * dataList.length);
            const selectedData = dataList[randomIndex];

            // تحديث العناصر في الـ HTML
            quoteElement.innerText = selectedData.text;
            imgElement.src = selectedData.image;
        }

        // دالة النسخ
        function copyQuote() {
            const quoteText = document.getElementById("quote").innerText;
            navigator.clipboard.writeText(quoteText).then(() => {
                alert("تم نسخ النص بنجاح!");
            }).catch(err => {
                console.error("خطأ في النسخ: ", err);
            });
        }
    </script>

</body>
</html>
