<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رابط 2026 | صوت الحكم والرزانة</title>
    
    <style>
        /* إعادة ضبط القواعد والتنسيق الأساسي */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* حاوية البطاقة الرئيسية */
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 30px 24px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            color: #38bdf8;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
        }

        /* صندوق عرض الفيلسوف والنص */
        .quote-box {
            background-color: #0f172a;
            border-right: 4px solid #ef4444;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        /* صورة الفيلسوف */
        .avatar-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #38bdf8;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* اسم الفيلسوف */
        .author-name {
            color: #38bdf8;
            font-size: 15px;
            font-weight: bold;
        }

        .quote-text {
            color: #e2e8f0;
            font-size: 16px;
            line-height: 1.8;
            font-weight: 400;
            text-align: right;
            width: 100%;
        }

        /* أزرار التفاعل */
        .button-group {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        .btn-main {
            background-color: #ef4444;
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }

        .btn-copy {
            background-color: #334155;
            color: #38bdf8;
            border: 1px solid #475569;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }

        .btn-main:active, .btn-copy:active {
            transform: scale(0.98);
        }

        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>رابط 2026</h1>
        <p class="subtitle">صوت الفلسفة والواقع.. كفّ عن التهرج والاستجداء</p>

        <!-- صندوق المحتوى -->
        <div class="quote-box">
            <!-- صورة الفيلسوف -->
            <img id="quote-img" class="avatar-img" src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Socrates_Louvre.jpg/300px-Socrates_Louvre.jpg" alt="صورة الفيلسوف">
            
            <!-- اسم الفيلسوف -->
            <div id="author-name" class="author-name">سقراط</div>

            <!-- النص الصارم -->
            <p id="quote" class="quote-text">تكلم حتى أراك.. أما الصراخ والتصنع وحركات المهرجين فلا تعكس إلا فراغاً باطنياً يحتاج إلى علاج.</p>
        </div>

        <!-- أزرار التفاعل -->
        <div class="button-group">
            <button class="btn-main" onclick="generateQuote()">تلقَّ الواقع الفلسفي</button>
            <button class="btn-copy" onclick="copyQuote()">نسخ النص</button>
        </div>

        <footer>
            رابط 2026 &copy; الرزانة ليست خياراً، بل ثمن احترامك لنفسك.
        </footer>
    </div>

    <script>
        // مصفوفة البيانات (تحتوي على النص، اسم الفيلسوف، ورابط صورته)
        const dataList = [
            {
                author: "سقراط",
                text: "تكلم حتى أراك.. الصمت والوقار هما زينة العقل، أما محاولة إضحاك الناس بالحرَكات السخيفة والعفوية المصنوعة فهي اعتراف صريح بضآلة عقلك وعدم قدرتك على فرض احترامك بالمنطق والرزانة.",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Socrates_Louvre.jpg/300px-Socrates_Louvre.jpg"
            },
            {
                author: "فريدريك نيتشه",
                text: "إن استجداء إعجاب الدهماء عن طريق السخافة والتمثيل ليس سوى انحطاط للذات. من يضع قناع المهرج ليحصل على ضحكة رخيصة يبيع كرامته بالمجان، ويصبح أداة لتسلية الآخرين لا أكثر.",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Nietzsche1872.jpg/300px-Nietzsche1872.jpg"
            },
            {
                author: "آرثر شوبنهاور",
                text: "كلما كان المرء خالي الفكر والروح، كلما مال إلى الضجيج والعفوية المبتذلة ليشعر بوجوده. الإنسان العظيم يكتفي بذاته ويهاب الابتذال، أما التهرّج فهو ملجأ من لا يستطيع الصمود مع عقله.",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Arthur_Schopenhauer_by_J_S_Biewener_crop.jpg/300px-Arthur_Schopenhauer_by_J_S_Biewener_crop.jpg"
            },
            {
                author: "أرسطو",
                text: "الاعتدال والوقار هما رأس الفضيلة. إن السخافة الزائدة ليست خفة ظل بل هي نقص في الأدب والحكمة. من لا يعرف كيف يضبط لسانه وحركاته في المجالس يقلل من قدره أمام العقلاء.",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/ae/Aristotle_Altemps_Inv8575.jpg/300px-Aristotle_Altemps_Inv8575.jpg"
            }
        ];

        // دالة تحديث النص والصورة واسم الفيلسوف عشوائياً
        function generateQuote() {
            const quoteElement = document.getElementById("quote");
            const imgElement = document.getElementById("quote-img");
            const authorElement = document.getElementById("author-name");
            
            // اختيار عنصر عشوائي من المصفوفة
            const randomIndex = Math.floor(Math.random() * dataList.length);
            const selectedData = dataList[randomIndex];

            // تحديث العناصر في الـ HTML
            quoteElement.innerText = selectedData.text;
            imgElement.src = selectedData.image;
            authorElement.innerText = selectedData.author;
        }

        // دالة نسخ النص
        function copyQuote() {
            const quoteText = document.getElementById("quote").innerText;
            const authorName = document.getElementById("author-name").innerText;
            const fullTextToCopy = `"${quoteText}"\n- ${authorName}`;

            navigator.clipboard.writeText(fullTextToCopy).then(() => {
                alert("تم نسخ الحكمة بنجاح!");
            }).catch(err => {
                console.error("خطأ في النسخ: ", err);
            });
        }
    </script>

</body>
</html>
